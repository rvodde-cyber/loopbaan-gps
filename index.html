<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loopbaan GPS — vind jouw route</title>
<meta name="description" content="Ontdek in vier korte stappen welke opleidingen en beroepen bij je passen en bereid je voor op het gesprek met je mentor of decaan. Je antwoorden blijven op je eigen apparaat.">
<meta name="theme-color" content="#1E3552">
<meta property="og:title" content="Loopbaan GPS — vind jouw route">
<meta property="og:description" content="Ontdek in vier korte stappen welke opleidingen en beroepen bij je passen en bereid je voor op het gesprek met je mentor of decaan. Je antwoorden blijven op je eigen apparaat.">
<meta property="og:url" content="https://loopbaangps.moreelvakmanschap.nl/">
<meta property="og:locale" content="nl_NL">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --terra:#C15E3C; --terra-d:#9E4526; --terra-l:#E08A64;
    --staal:#3F6EA8; --staal-d:#274d7d; --staal-l:#6E97CC;
    --salie:#6E9268; --salie-d:#4c6b47; --salie-l:#93B58C;
    --amber:#CE8A25; --amber-d:#96610f; --amber-l:#E7AE52;
    --ink:#2A2620; --muted:#5F5A52; --line:rgba(42,38,32,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"DM Sans",system-ui,sans-serif;color:var(--ink);
    background:#EFE9DF;
    background-image:radial-gradient(1100px 720px at 50% 0%, #FBF8F2, transparent 62%),
      radial-gradient(900px 600px at 50% 110%, rgba(63,110,168,.10), transparent 60%);
    min-height:100vh;padding:40px 20px 64px}
  #app{width:100%;max-width:600px;margin:0 auto}
  .center{text-align:center}
  .eyebrow{font-family:"DM Mono",monospace;font-size:12px;letter-spacing:.03em}
  h1{font-family:"Cormorant Garamond",serif;font-weight:500;line-height:1.1}
  .h-xl{font-size:52px}.h-l{font-size:40px}.h-m{font-size:30px}
  .sub{color:var(--muted);font-size:15.5px;margin-top:10px;max-width:44ch;margin-left:auto;margin-right:auto;line-height:1.55}

  .card{background:rgba(255,255,255,.66);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
    border:1px solid rgba(255,255,255,.9);border-radius:22px;padding:26px 24px;
    box-shadow:0 22px 46px -22px rgba(42,38,32,.35),0 2px 6px rgba(42,38,32,.07),inset 0 1px 0 rgba(255,255,255,.9)}
  .card + .card{margin-top:16px}

  .btn{border:none;border-radius:16px;padding:16px 22px;font-family:"DM Sans",sans-serif;font-size:16px;font-weight:500;
    color:#fff;cursor:pointer;width:100%;box-shadow:0 16px 30px -12px rgba(42,38,32,.4),inset 0 2px 3px rgba(255,255,255,.3);transition:transform .1s}
  .btn:active{transform:scale(.985)}
  .btn.ink{background:radial-gradient(120% 140% at 40% 20%, #4a443b, var(--ink) 70%)}
  .btn.salie{background:radial-gradient(120% 140% at 40% 20%, var(--salie-l), var(--salie) 60%, var(--salie-d))}
  .btn.ghost{background:rgba(42,38,32,.05);color:var(--ink);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
  .ghost-link{display:block;text-align:center;margin-top:14px;color:var(--muted);font-size:13.5px;background:none;border:none;cursor:pointer;width:100%}

  /* progress satellites */
  .prog{display:flex;align-items:center;gap:14px;margin-bottom:26px}
  .prog .steps{display:flex;gap:6px;flex:1}
  .prog .steps i{height:6px;border-radius:99px;flex:1;background:rgba(42,38,32,.12)}
  .prog .steps i.on{background:var(--salie)}
  .prog .lbl{font-family:"DM Mono",monospace;font-size:11.5px;color:var(--muted);white-space:nowrap}
  .modbadge{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
  .modbadge svg{width:20px;height:20px}
  .bg-terra{background:radial-gradient(circle at 36% 30%, var(--terra-l), var(--terra) 62%, var(--terra-d));box-shadow:0 8px 16px -6px rgba(193,94,60,.6)}
  .bg-staal{background:radial-gradient(circle at 36% 30%, var(--staal-l), var(--staal) 62%, var(--staal-d));box-shadow:0 8px 16px -6px rgba(63,110,168,.6)}
  .bg-salie{background:radial-gradient(circle at 36% 30%, var(--salie-l), var(--salie) 62%, var(--salie-d));box-shadow:0 8px 16px -6px rgba(110,146,104,.6)}
  .bg-amber{background:radial-gradient(circle at 36% 30%, var(--amber-l), var(--amber) 62%, var(--amber-d));box-shadow:0 8px 16px -6px rgba(206,138,37,.55)}

  /* forced choice cards */
  .choices{display:grid;gap:14px;margin-top:24px}
  .choice{background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:18px;padding:22px;font-size:17px;cursor:pointer;text-align:left;
    box-shadow:0 10px 22px -14px rgba(42,38,32,.4),inset 0 1px 0 rgba(255,255,255,.8);transition:transform .1s, border-color .15s}
  .choice:hover{border-color:var(--terra-l)}
  .choice:active{transform:scale(.99)}

  /* value chips */
  .chips{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
  .chip{background:rgba(255,255,255,.7);border:1.5px solid var(--line);border-radius:15px;padding:16px;font-size:14.5px;cursor:pointer;text-align:left;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.8);transition:.15s}
  .chip.on{border-color:var(--staal);background:rgba(63,110,168,.10);color:var(--staal-d);font-weight:500}
  .chip .num{font-family:"DM Mono",monospace;font-size:11px;color:var(--staal);margin-right:6px}

  /* sliders */
  .axis + .axis{margin-top:28px;padding-top:26px;border-top:1px solid var(--line)}
  .poles{display:flex;justify-content:space-between;margin-bottom:12px}
  .pole{max-width:44%}.pole.r{text-align:right}
  .pole .t{font-size:16px;font-weight:500}.pole .d{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:99px;outline:none;margin-top:6px;
    background:linear-gradient(90deg,var(--salie-l),#E7E0D4 50%,var(--salie-l));box-shadow:inset 0 1px 3px rgba(42,38,32,.18)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;cursor:grab;
    background:radial-gradient(circle at 36% 30%,#fff,#F1EBE0 70%,#E3DACB);border:1px solid rgba(42,38,32,.12);
    box-shadow:0 8px 16px -5px rgba(42,38,32,.4),inset 0 2px 3px rgba(255,255,255,.9)}
  input[type=range]::-moz-range-thumb{width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 36% 30%,#fff,#E3DACB);border:1px solid rgba(42,38,32,.12)}
  .read{text-align:center;font-family:"DM Mono",monospace;font-size:12px;color:var(--salie-d);margin-top:10px}

  /* likert */
  .lik{padding:16px 0;border-bottom:1px solid var(--line)}
  .lik:last-child{border-bottom:none}
  .lik .q{font-size:15.5px;margin-bottom:10px}
  .dots{display:flex;gap:8px}
  .dots button{flex:1;height:38px;border-radius:11px;border:1.5px solid var(--line);background:rgba(255,255,255,.6);cursor:pointer;
    font-family:"DM Mono",monospace;font-size:13px;color:var(--muted)}
  .dots button.on{background:radial-gradient(circle at 40% 30%,var(--amber-l),var(--amber) 65%);color:#fff;border-color:transparent;box-shadow:0 6px 12px -5px rgba(206,138,37,.6)}

  /* result */
  .sigrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
  .sig{border-radius:16px;padding:15px 16px;color:#fff;box-shadow:0 12px 24px -12px rgba(42,38,32,.5),inset 0 2px 3px rgba(255,255,255,.3)}
  .sig .lab{font-family:"DM Mono",monospace;font-size:10.5px;opacity:.85;letter-spacing:.03em}
  .sig .val{font-size:16px;font-weight:500;margin-top:4px;line-height:1.25}
  .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .tag{background:rgba(42,38,32,.06);border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-size:13.5px}
  details{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
  summary{cursor:pointer;font-size:14.5px;font-weight:500;color:var(--staal-d);list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸ ";color:var(--staal)}
  details[open] summary::before{content:"▾ "}
  .step{font-size:14px;color:var(--muted);margin-top:10px;line-height:1.5;padding-left:14px;border-left:2px solid var(--line)}
  .reflect .q{font-size:15.5px;margin-top:12px;padding-left:16px;position:relative}
  .reflect .q::before{content:"—";position:absolute;left:0;color:var(--terra)}

  /* verder kijken */
  a.btn{display:inline-block;text-align:center;text-decoration:none}
  .verder-kijken-inner{display:flex;flex-direction:column;gap:20px;margin-top:4px}
  .verder-kijken-preview a{display:block;border-radius:18px;overflow:hidden;border:1px solid var(--line);
    box-shadow:0 10px 22px -14px rgba(42,38,32,.35),inset 0 1px 0 rgba(255,255,255,.8)}
  .verder-kijken-preview img{display:block;max-width:100%;height:auto;border-radius:18px}
  .verder-kijken-body .sub{text-align:left;margin-left:0;margin-right:0}
  .verder-kijken-body .btn{margin-top:18px}
  .verder-kijken-meta{font-family:"DM Mono",monospace;font-size:11.5px;color:var(--muted);margin-top:10px}
  .verder-kijken-bron{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.5}
  .verder-kijken a:focus-visible{outline:2px solid var(--staal);outline-offset:3px;border-radius:16px}
  .verder-kijken-preview a:focus-visible{border-radius:18px}
  @media (min-width:900px){
    .verder-kijken-inner{flex-direction:row;align-items:flex-start;gap:26px}
    .verder-kijken-preview{flex:0 0 55%;max-width:55%}
    .verder-kijken-body{flex:1;min-width:0}
  }
  @media (max-width:899px){.verder-kijken-body .btn{width:100%}}

  /* omslag #cover */
  body.is-cover{padding:0;background:#1E3552}
  body.is-cover{background-image:none}
  #app.is-cover{max-width:none;margin:0;width:100%}
  .cover{min-height:100vh;min-height:100dvh}
  .cover-inner{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
  .cover-art{position:relative;overflow:hidden;flex-shrink:0;height:58vh;min-height:58vh}
  .cover-art svg{width:100%;height:100%;display:block}
  .cover-panel{background:#1E3552;color:#F1EBDF;padding:28px 24px 36px;flex:1}
  .cover-kicker{font-family:"DM Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.88}
  .cover-title{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:clamp(38px,8vw,52px);line-height:1.08;margin-top:10px}
  .cover-sub{font-size:15.5px;line-height:1.55;margin-top:12px;max-width:44ch;opacity:.92}
  .cover-steps{list-style:none;margin-top:22px;display:flex;flex-direction:column;gap:11px}
  .cover-steps li{display:flex;align-items:center;gap:10px;font-size:14.5px}
  .cover-step-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 2px rgba(241,235,223,.25)}
  .cover-step-dot.terra{background:var(--terra)}
  .cover-step-dot.staal{background:var(--staal)}
  .cover-step-dot.salie{background:var(--salie)}
  .cover-step-dot.amber{background:var(--amber)}
  .cover-panel .btn{margin-top:26px}
  .cover-meta{font-family:"DM Mono",monospace;font-size:11.5px;opacity:.72;margin-top:14px;text-align:center}
  .cover-panel .btn:focus-visible,.cover-panel button:focus-visible{outline:2px solid #F1EBDF;outline-offset:3px}
  @media (min-width:900px){
    .cover-inner{display:grid;grid-template-columns:1fr 1fr;align-items:stretch}
    .cover-art{height:auto;min-height:100vh;min-height:100dvh}
  }
  @media (min-width:900px){
    .cover-panel{display:flex;flex-direction:column;justify-content:center;padding:48px 56px}
    .cover-meta{text-align:left}
  }
  @media (prefers-reduced-motion:no-preference){
    .cover-art.cv-animate #cv-route{stroke-dasharray:1400;stroke-dashoffset:1400;animation:cv-route-draw 1.4s ease-out forwards}
  }
  @keyframes cv-route-draw{to{stroke-dashoffset:0}}

  .app-foot{margin-top:28px;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 18px;justify-content:center}
  .foot-link{background:none;border:none;padding:0;font-family:"DM Mono",monospace;font-size:12px;color:var(--muted);cursor:pointer;text-decoration:underline}
  .foot-link:focus-visible{outline:2px solid var(--staal);outline-offset:3px;border-radius:4px}
  .cover-foot{margin-top:22px;display:flex;gap:16px;flex-wrap:wrap}
  .cover-foot .foot-link{color:#F4ECDD}
  .intro-note{font-size:13.5px;line-height:1.55;color:var(--muted);margin-top:12px}
  .visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .wipe-backdrop{position:fixed;inset:0;background:rgba(30,53,82,.45);z-index:90}
  .wipe-dialog{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:91;width:min(420px,calc(100% - 32px));
    background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:20px;padding:24px 22px;box-shadow:0 24px 48px -16px rgba(42,38,32,.45)}
  .wipe-dialog h2{font-family:"Cormorant Garamond",serif;font-size:26px;font-weight:500}
  .wipe-dialog p{margin-top:12px;font-size:15px;line-height:1.55;color:var(--ink)}
  .wipe-actions{display:flex;flex-direction:column;gap:10px;margin-top:20px}
  .wipe-actions .btn.ghost{color:var(--ink)}
  .over-block{margin-top:18px}
  .over-block h2{font-family:"Cormorant Garamond",serif;font-size:22px;margin-bottom:8px}
  .over-block p,.over-block li{font-size:15px;line-height:1.55;color:var(--ink)}
  .over-block ul{margin:8px 0 0 1.1em}

  .gesprekskaart{margin-top:20px;padding:0;overflow:hidden}
  .gespreks-band{display:flex;height:7px}
  .gespreks-band span{flex:1}
  .gespreks-band .terra{background:var(--terra)}
  .gespreks-band .staal{background:var(--staal)}
  .gespreks-band .salie{background:var(--salie)}
  .gespreks-band .amber{background:var(--amber)}
  .gesprekskaart-inner{padding:26px 24px}
  .gesprekskaart h2{font-family:"Cormorant Garamond",serif;font-size:26px;font-weight:500}
  .gesprekskaart .gk-intro{margin-top:8px;font-size:15.5px;line-height:1.55}
  .gesprekskaart .gk-block{margin-top:18px;font-size:15px;line-height:1.55}
  .gesprekskaart .gk-block strong{display:block;font-size:13px;font-family:"DM Mono",monospace;letter-spacing:.02em;color:var(--muted);margin-bottom:6px;font-weight:500}
  .gesprekskaart ol{margin:10px 0 0 1.2em;padding:0}
  .gesprekskaart ol li{margin-top:8px;line-height:1.45}
  .gespreks-field{margin-top:16px}
  .gespreks-field label{display:block;font-size:15px;font-weight:500;margin-bottom:8px}
  .gespreks-field textarea{width:100%;min-height:96px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);
    font-family:"DM Sans",sans-serif;font-size:15px;line-height:1.5;resize:vertical;background:rgba(255,255,255,.85)}
  .gespreks-field textarea:focus-visible{outline:2px solid var(--staal);outline-offset:2px}
  .gespreks-count{font-family:"DM Mono",monospace;font-size:11px;color:var(--muted);margin-top:6px;text-align:right}
  .gespreks-print{display:none;font-size:15px;line-height:1.55;white-space:pre-wrap;padding:8px 0 12px}
  .gespreks-print.empty{min-height:2.8em;border-bottom:1px dashed var(--muted)}
  @media print{
    .gesprekskaart textarea{display:none!important}
    .gespreks-count{display:none!important}
    .gespreks-print{display:block!important}
    .gespreks-print.empty{border-bottom:1px dashed rgba(42,38,32,.35)}
  }

  button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible,.choice:focus-visible,.chip:focus-visible,.foot-link:focus-visible{outline:2px solid var(--staal);outline-offset:3px}

  @media (max-width:520px){.chips{grid-template-columns:1fr}.h-xl{font-size:42px}.h-l{font-size:34px}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  @media print{body{background:#fff;padding:0}.card{box-shadow:none;border:1px solid #ddd}.noprint{display:none!important}.verder-kijken{display:none!important}.cover{display:none!important}}
</style>
<script src="vendor/html2canvas.min.js"></script>
</head>
<body>
<div id="app"></div>
<div id="wipe-backdrop" class="wipe-backdrop noprint" hidden></div>
<div id="wipe-dialog" class="wipe-dialog noprint" role="dialog" aria-modal="true" aria-labelledby="wipe-title" hidden>
  <h2 id="wipe-title">Gegevens wissen?</h2>
  <p>Weet je het zeker? Je antwoorden en notities op dit apparaat worden verwijderd.</p>
  <div class="wipe-actions">
    <button type="button" class="btn ink" onclick="confirmWipe()">Ja, wis alles</button>
    <button type="button" class="btn ghost" onclick="closeWipeDialog()">Annuleren</button>
  </div>
</div>
<div id="screen-announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
<div id="status-announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

<script>
/* ---------------- DATA ---------------- */
const RIASEC = {R:"Realistisch",I:"Intellectueel",A:"Artistiek",S:"Sociaal",W:"Ondernemend",C:"Conventioneel"};
/* Volledig gebalanceerd: alle 15 mogelijke paren (R,I,A,S,W,C) komen elk precies
   1x voor, in willekeurige volgorde — geen enkel type wordt vaker afgezet
   tegen een ander type dan de rest. */
const M1 = [
  {a:{t:"Met je handen iets afmaken",c:"R"}, b:{t:"Een administratie kloppend maken",c:"C"}},
  {a:{t:"Een probleem grondig analyseren",c:"I"}, b:{t:"Een verhaal, beeld of ontwerp maken",c:"A"}},
  {a:{t:"Iemand persoonlijk verder helpen",c:"S"}, b:{t:"Een team of project leiden",c:"W"}},
  {a:{t:"Iets in elkaar zetten of repareren",c:"R"}, b:{t:"Uitzoeken waarom iets werkt",c:"I"}},
  {a:{t:"Vrij en creatief werken, zonder vast stramien",c:"A"}, b:{t:"Structuur en overzicht aanbrengen",c:"C"}},
  {a:{t:"Iets grondig uitzoeken voordat je beslist",c:"I"}, b:{t:"Volgens duidelijke regels werken",c:"C"}},
  {a:{t:"Zorgen dat techniek werkt",c:"R"}, b:{t:"Een eigen initiatief starten",c:"W"}},
  {a:{t:"Je eigen stijl laten zien in wat je maakt",c:"A"}, b:{t:"Anderen begeleiden of lesgeven",c:"S"}},
  {a:{t:"Mensen samenbrengen en verbinden",c:"S"}, b:{t:"Nauwkeurig gegevens verwerken",c:"C"}},
  {a:{t:"Onderzoek doen naar een vraag",c:"I"}, b:{t:"Een groep enthousiasmeren voor een plan",c:"W"}},
  {a:{t:"Met gereedschap of techniek werken",c:"R"}, b:{t:"Iets bedenken dat nog niet bestaat",c:"A"}},
  {a:{t:"Een eigen idee tot leven brengen",c:"A"}, b:{t:"Anderen meekrijgen in jouw plan",c:"W"}},
  {a:{t:"Buiten of praktisch bezig zijn",c:"R"}, b:{t:"Contact maken met nieuwe mensen",c:"S"}},
  {a:{t:"Data en feiten uitpluizen",c:"I"}, b:{t:"Iemand helpen die vastloopt",c:"S"}},
  {a:{t:"Een eigen plan trekken en risico nemen",c:"W"}, b:{t:"Volgens een vast systeem werken",c:"C"}}
];
const VALUES = [
  {id:"W01",l:"Iets betekenen voor anderen"},{id:"W02",l:"Bijdragen aan een eerlijkere wereld"},
  {id:"W03",l:"Vrijheid en zelf bepalen hoe ik werk"},{id:"W04",l:"Nieuwe dingen ontdekken en leren"},
  {id:"W05",l:"Ergens goed in worden en presteren"},{id:"W06",l:"Invloed hebben en dingen in beweging zetten"},
  {id:"W07",l:"Zekerheid en een stabiele basis"},{id:"W08",l:"Ergens bij horen, samen optrekken"},
  {id:"W09",l:"Zorgvuldig en betrouwbaar werk leveren"},{id:"W10",l:"Plezier en energie in wat ik doe"}
];
const COMP = [

function snapshotState(){
  return {screen:S.screen,returnTo:S.returnTo,m1i:S.m1i,m1hist:S.m1hist,riasec:S.riasec,values:S.values,env:S.env,comp:S.comp,focus:S.focus,relayFrom:S.relayFrom,tw:S.tw,notes:S.notes};
}
function applyState(st){
  Object.assign(S,st);
  if(!S.tw) S.tw={chosen:[],as1:null,dom:null};
  if(!S.notes) S.notes={twijfel:"",plan:""};
  if(!S.returnTo) S.returnTo="intro";
}
window.setNote=(key,val)=>{
  if(!S.notes) S.notes={twijfel:"",plan:""};
  S.notes[key]=String(val).slice(0,400);
  saveState();
  const c=document.getElementById("note-count-"+key);
  if(c) c.textContent=S.notes[key].length+"/400";
  const ta=document.getElementById("note-"+key);
  const field=ta&&ta.closest(".gespreks-field");
  if(field){
    const pr=field.querySelector(".gespreks-print");
    if(pr){
      const v=S.notes[key].trim();
      pr.textContent=v;
      pr.classList.toggle("empty",!v);
    }
  }
};
function syncGespreksPrint(doc){
  const root=doc||document;
  root.querySelectorAll(".gespreks-field").forEach((field)=>{
    const ta=field.querySelector("textarea");
    const pr=field.querySelector(".gespreks-print");
    if(!ta||!pr) return;
    const v=ta.value.trim();
    pr.textContent=v;
    pr.classList.toggle("empty",!v);
  });
}
function resetStateFields(){applyState(defaultState());}
function saveState(){
  try{
    const payload={version:1,savedAt:new Date().toISOString(),state:snapshotState()};
    localStorage.setItem(STORAGE_KEY,JSON.stringify(payload));
  }catch(e){}
}
function loadState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){
      const bag=JSON.parse(raw);
      if(bag.savedAt){
        const age=Date.now()-new Date(bag.savedAt).getTime();
        if(age>STORAGE_MAX_DAYS*86400000){clearState();return false;}
      }
      if(bag.state){applyState(bag.state);return true;}
    }
    const legacy=sessionStorage.getItem(LEGACY_SESSION_KEY);
    if(legacy){
      applyState(JSON.parse(legacy));
      sessionStorage.removeItem(LEGACY_SESSION_KEY);
      saveState();
      return true;
    }
  }catch(e){}
  return false;
}
function clearState(){
  try{localStorage.removeItem(STORAGE_KEY);sessionStorage.removeItem(LEGACY_SESSION_KEY);}catch(e){}
}

  return `<div class="prog"><div class="modbadge bg-${m.k}">${m.ic}</div>
    <div class="steps" style="flex:1">${steps}</div>
    <div class="lbl">Signaal ${n}/4</div></div>`;
}
function envScores(){return{Mensen:S.env.s1/100*3,Dingen:(100-S.env.s1)/100*3,Ideeen:S.env.s2/100*3,Data:(100-S.env.s2)/100*3};}
function riasecTop(k){return Object.entries(S.riasec).sort((a,b)=>b[1]-a[1]).slice(0,k).map(e=>e[0]);}

/* ---------------- SCORING ---------------- */
function compute(){
  const env=envScores();
  const rmax=Math.max(1,...Object.values(S.riasec));
  return GROUPS.map(g=>{
    // riasec
    let rDot=0,rNorm=0; for(const t in RIASEC){rDot+=(S.riasec[t]/rmax)*(g.riasec[t]||0); rNorm+=(g.riasec[t]||0);}
    const rScore=rNorm?rDot/rNorm:0;
    // env
    let eDot=0,eNorm=0; for(const o in ENVLABEL){eDot+=(env[o]/3)*(g.env[o]||0); eNorm+=(g.env[o]||0);}
    const eScore=eNorm?eDot/eNorm:0;
    // values
    const vScore=g.val.filter(v=>S.values.includes(v)).length/3;
    // competenties
    const rated=g.comp.map(c=>S.comp[c]).filter(x=>x); 
    const cScore=rated.length?(rated.reduce((a,b)=>a+b,0)/rated.length)/5:0.5;
    let total=.35*rScore+.20*eScore+.25*vScore+.20*cScore;
    // verdiepingskeuze geeft de best passende groep een duidelijke duw
    if(S.focus && FOCUS[S.focus].pref===g.id) total+=0.15;
    return {g,total,rScore,eScore,vScore,cScore};
  }).sort((a,b)=>b.total-a.total);
}
function needsDeepening(){
  const r=compute();
  return SOCIALGROUPS.includes(r[0].g.id) || (r[0].total-r[1].total)<0.06;
}

          <label for="note-twijfel">Waar twijfel ik nog over?</label>
          <textarea id="note-twijfel" maxlength="400" oninput="setNote('twijfel',this.value)">${noteTwijfel.replace(/</g,"&lt;")}</textarea>
          <div class="gespreks-print ${noteTwijfel?"":"empty"}">${noteTwijfel.replace(/</g,"&lt;")}</div>
          <div class="gespreks-count" id="note-count-twijfel">${noteTwijfel.length}/400</div>
        </div>
        <div class="gespreks-field">
          <label for="note-plan">Wat ga ik de komende maand doen? (bijv. open dag, meeloopdag, gesprek met een student)</label>
          <textarea id="note-plan" maxlength="400" oninput="setNote('plan',this.value)">${notePlan.replace(/</g,"&lt;")}</textarea>
          <div class="gespreks-print ${notePlan?"":"empty"}">${notePlan.replace(/</g,"&lt;")}</div>
          <div class="gespreks-count" id="note-count-plan">${notePlan.length}/400</div>
        </div>
      </div>
    </section>`;
  const verderKijken=`<section class="card verder-kijken" data-html2canvas-ignore="true" aria-labelledby="verder-kijken-titel">
      <div class="verder-kijken-inner">
        <div class="verder-kijken-preview">
          <a href="hbo-opleidingen-sociaal-domein.pdf" target="_blank" rel="noopener">
            <img src="hbo-opleidingen-sociaal-domein-preview.webp" alt="Voorbeeld van het vergelijkingsoverzicht hbo-opleidingen sociaal domein" width="900" height="637" loading="lazy">
          </a>
        </div>
        <div class="verder-kijken-body">
          <div class="eyebrow" style="color:var(--salie-d)">Verder kijken</div>
          <h2 id="verder-kijken-titel" class="h-m" style="margin-top:8px">Hbo-opleidingen in het sociaal domein</h2>
          <p class="sub" style="margin-top:10px">Vier mensgerichte hbo-opleidingen naast elkaar: Human Resource Management, Toegepaste Psychologie, Pedagogiek en Social Work. Je ziet per opleiding de richting, typische vakken, voorbeeldberoepen en het ethisch kader — waar ze elkaar raken en waar ze uiteenlopen.</p>
          ${verderKijkenSociaal?`<p class="sub" style="margin-top:10px">Jouw profiel scoort hoog op Sociaal — dit overzicht sluit goed aan bij je uitslag.</p>`:""}
          <a class="btn salie" href="hbo-opleidingen-sociaal-domein.pdf" download="hbo-opleidingen-sociaal-domein.pdf">Download overzicht (PDF)</a>
          <p class="verder-kijken-meta">PDF · 1 pagina · A4 liggend · 104 kB</p>
          <p class="verder-kijken-bron">Bron: eigen vergelijking op basis van opleidingspagina's van o.a. Hanze, HvA, HAN en Saxion en Studiekeuze123 (september 2026). Vakken en beroepen verschillen per hogeschool — check altijd de opleidingspagina van je eigen keuze.</p>
        </div>
      </div>
    </section>`;
  set(`<div class="center" style="padding-top:6px">
      <div class="eyebrow" style="color:var(--salie-d)">✦ route berekend</div>
      <h1 class="h-l" style="margin-top:12px">Je route wijst richting<br>${best.zin}.</h1>
    </div>

    <div class="card" style="margin-top:24px">
      <div style="font-family:'DM Mono',monospace;font-size:11.5px;color:var(--muted);margin-bottom:12px">JOUW VIER SIGNALEN</div>
      <div class="sigrow">
        <div class="sig bg-terra"><div class="lab">INTERESSES</div><div class="val">${top.join(" · ")}</div></div>
        <div class="sig bg-staal"><div class="lab">WAARDEN</div><div class="val">${vlabels[0]}</div></div>
        <div class="sig bg-salie"><div class="lab">WERKOMGEVING</div><div class="val">${envTop.join(" & ")}</div></div>
        <div class="sig bg-amber"><div class="lab">STERKSTE COMPETENTIES</div><div class="val">${compTop[0]}</div></div>
      </div>
    </div>

    <div class="card">
      <div style="font-family:'DM Mono',monospace;font-size:11.5px;color:var(--muted);margin-bottom:12px">WAT JOUW CODE BETEKENT</div>
      ${topCodes.slice(0,2).map(c=>{const t=TYPEMETA[c];return `<div style="margin-bottom:14px">
        <div style="font-family:'Cormorant Garamond',serif;font-size:21px"><b>${c}</b> · ${t.naam} <span style="color:var(--muted);font-style:italic;font-size:16px">— "${t.tagline}"</span></div>
        <div class="sub" style="text-align:left;margin-top:4px">${t.uitleg}</div>
        <div class="tags" style="margin-top:8px">${t.woorden.map(w=>`<span class="tag">${w}</span>`).join("")}</div>
      </div>`;}).join("")}
    </div>

    <div class="card">
      <h1 class="h-m">${naam}</h1>
      <p class="sub" style="text-align:left;margin-top:8px">Beroepen die passen bij jouw sterkste interesses (${topCodes.slice(0,2).map(c=>TYPEMETA[c].naam).join(" en ")}):</p>
      <div style="margin-top:12px">
      ${typeBeroepen.map(b=>`<div style="padding:12px 0;border-top:1px solid var(--line)">
        <div style="font-size:16px;font-weight:500">${b.beroep}</div>
        <div style="font-family:'DM Mono',monospace;font-size:11.5px;color:var(--salie-d);margin-top:2px">${b.opleiding}</div>
        <div class="sub" style="text-align:left;margin-top:4px">${b.omschrijving}</div>
      </div>`).join("")}
      </div>
    </div>

    <div class="card">
      <details open>
        <summary>Hoe komt deze route tot stand?</summary>
        <div class="step">Je interesses (${top.slice(0,2).join(" en ")}) wijzen naar deze hoek — dat signaal weegt het zwaarst.</div>
        <div class="step">Je waarde "${vlabels[0]}" bevestigt de richting.</div>
        <div class="step">Je voorkeur voor ${envTop.join(" en ")} sluit hierop aan.</div>
        ${f?`<div class="step">Bij de kruising koos je voor <b>${f.sub}</b> — dat maakte de route binnen dit brede veld scherper.</div>`:''}
        <div class="step">Er past nog een tweede route bij je: <b>${second.naam}</b> — het verkennen waard.</div>
      </details>
    </div>

    <div class="card reflect" style="background:rgba(193,94,60,.06);border-color:rgba(193,94,60,.2)">
      <div style="font-family:'Cormorant Garamond',serif;font-size:24px">Jij bent meer dan een code</div>
      <div class="q">Herken je jezelf in deze richting?</div>
      <div class="q">Wat mis je in dit beeld dat voor jou juist belangrijk is?</div>
      <div class="q">Als je dit advies even wegdenkt — waar zou jíj naartoe willen?</div>
    </div>

    ${social?`<div class="card noprint" style="border:2px solid var(--salie);background:rgba(110,146,104,.08)">
      <div class="eyebrow" style="color:var(--salie-d)">laatste stap · finetuning</div>
      <div style="font-family:'Cormorant Garamond',serif;font-size:24px;margin-top:6px">Nog aan het twijfelen tussen concrete opleidingen?</div>
      <p class="sub" style="text-align:left;margin-top:8px">Binnen deze richting lijken opleidingen als pabo, social work, pedagogiek en hrm op elkaar. Zet ze naast elkaar en zie wat het verschil écht is.</p>
      <div style="margin-top:14px"><button class="btn salie" onclick="startTwijfel()">Vergelijk de opleidingen →</button></div>
    </div>`:''}

    <div id="bewaar-uitvoer">
    ${gesprekskaart}
    <div id="routekaart" style="margin-top:20px;border-radius:20px;overflow:hidden;display:flex;
        background:radial-gradient(140% 160% at 20% 10%, #33463f, #202a26 70%);color:#F1EBDF;
        box-shadow:0 22px 46px -20px rgba(42,38,32,.5)">
      <div style="padding:22px 18px;border-right:2px dashed rgba(241,235,223,.28);text-align:center;display:flex;flex-direction:column;justify-content:center;min-width:118px">
        <div style="font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.12em;opacity:.7">CODE</div>
        <div style="font-family:'Cormorant Garamond',serif;font-size:34px;line-height:1;margin-top:6px">${top.map(t=>t[0]).join("·")}</div>
      </div>
      <div style="padding:20px;flex:1">
        <div style="font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.12em;opacity:.7">LOOPBAAN GPS · BESTEMMING</div>
        <div style="font-family:'Cormorant Garamond',serif;font-size:23px;line-height:1.15;margin-top:6px">${naam}</div>
        <div style="font-size:12.5px;opacity:.85;margin-top:8px;line-height:1.4">${best.zin}</div>
        <div style="font-family:'DM Mono',monospace;font-size:10.5px;opacity:.6;margin-top:12px">${new Date().toLocaleDateString('nl-NL')} · een route om te verkennen</div>
      </div>
    </div>
    </div>

    <div style="margin-top:18px" class="noprint">
      <button class="btn salie" onclick="saveCard()">Bewaar als afbeelding</button>
      <button class="ghost-link" onclick="window.print()">Of bewaar de hele route als PDF</button>
    </div>
    ${verderKijken}
    <button type="button" class="ghost-link noprint" onclick="openWipeDialog()">Wis mijn gegevens</button>
    <button type="button" class="ghost-link noprint" onclick="restart()">Opnieuw beginnen</button>`);
}
window.saveCard=async()=>{
  syncGespreksPrint();
  const el=document.getElementById("bewaar-uitvoer");
  try{ if(window.html2canvas){const c=await html2canvas(el,{scale:2,backgroundColor:"#EFE9DF",onclone:(doc)=>{syncGespreksPrint(doc);doc.querySelectorAll(".gesprekskaart textarea").forEach(t=>{t.style.display="none";});doc.querySelectorAll(".gespreks-count").forEach(e=>{e.style.display="none";});doc.querySelectorAll(".gespreks-print").forEach(p=>{p.style.display="block";});}});
    const a=document.createElement("a");a.download="mijn-loopbaanroute.png";a.href=c.toDataURL("image/png");a.click();return;} }
  catch(e){}
  window.print();
};
window.restart=()=>{resetStateFields();S.screen="intro";saveState();render();focusHeading("intro-heading");};

/* ---- Twijfelhulp (finetuning) ---- */
window.startTwijfel=()=>{ S.tw={chosen:["pabo","social","pedagogiek","hrm"],as1:null,dom:null}; go('twIntro'); };
function twIntro(){
  const chips=Object.entries(OPL).map(([k,o])=>`<button class="chip ${S.tw.chosen.includes(k)?'on':''}" onclick="twToggle('${k}')">${o.naam}</button>`).join("");
  const ok=S.tw.chosen.length>=2;
  set(`<div class="center" style="padding-top:6px">
      <div class="eyebrow" style="color:var(--salie-d)">finetuning · twijfelhulp</div>
      <h1 class="h-l" style="margin-top:12px">Tussen welke opleidingen<br>twijfel jij nog?</h1>
      <p class="sub">Deze lijken op elkaar, maar verschillen echt. Kies er twee tot vier — we voorselecteerden er alvast een paar op basis van je route.</p></div>
    <div class="chips">${chips}</div>
    <div style="margin-top:24px"><button class="btn salie" ${ok?'':'disabled style="opacity:.45;cursor:default"'} onclick="${ok?"go('twQ1')":''}">${ok?'Laat het verschil zien':'Kies er minstens twee'}</button>
      <button class="ghost-link" onclick="go('result')">← terug naar mijn route</button></div>`);
}
window.twToggle=(k)=>{const i=S.tw.chosen.indexOf(k);if(i>=0)S.tw.chosen.splice(i,1);else if(S.tw.chosen.length<4)S.tw.chosen.push(k);twIntro();};
function twQ1(){
  set(`<div class="center"><div class="eyebrow" style="color:var(--salie-d)">vraag 1 van 2</div>
      <h1 class="h-m" style="margin-top:10px">Hoe werk je het liefst met mensen?</h1>
      <p class="sub">Er is geen beter of slechter — beide zijn even waardevol.</p></div>
    <div class="choices">
      <button class="choice" onclick="twA1('direct')"><b>Dírect met mensen</b><div class="d">zelf begeleiden, verzorgen, lesgeven — dicht op de persoon</div></button>
      <button class="choice" onclick="twA1('systeem')"><b>Aan het systeem eromheen</b><div class="d">adviseren, beleid maken, ontwerpen hoe het beter kan</div></button>
    </div>
    <button class="ghost-link" onclick="go('twIntro')">← terug</button>`);
}
window.twA1=(v)=>{S.tw.as1=v;go('twQ2');};
function twQ2(){
  const doms=[...new Set(S.tw.chosen.map(k=>OPL[k].dom))];
  const opts=doms.map(d=>`<button class="choice" onclick="twSetDom('${d}')"><b>${DOMLABEL[d].charAt(0).toUpperCase()+DOMLABEL[d].slice(1)}</b></button>`).join("");
  set(`<div class="center"><div class="eyebrow" style="color:var(--salie-d)">vraag 2 van 2</div>
      <h1 class="h-m" style="margin-top:10px">Waar gaat je hart het meest naar uit?</h1>
      <p class="sub">Kies wat het dichtst bij je komt.</p></div>
    <div class="choices">${opts}</div>
    <button class="ghost-link" onclick="go('twQ1')">← terug</button>`);
}
window.twSetDom=(d)=>{S.tw.dom=d;go('twResult');};
function twScore(k){const o=OPL[k];return (o.as1===S.tw.as1?2:0)+(o.dom===S.tw.dom?2:0);}
function twResult(){
  const ranked=[...S.tw.chosen].sort((a,b)=>twScore(b)-twScore(a));
  const bestScore=twScore(ranked[0]);const tie=ranked.filter(k=>twScore(k)===bestScore).length>1;
  const cards=ranked.map(k=>{const o=OPL[k];const best=twScore(k)===bestScore&&!tie;
    return `<div class="cmp ${best?'best':''}">
      ${best?'<div class="rib">LIJKT HET DICHTST BIJ JE ANTWOORDEN</div>':''}
      <h3>${o.naam}</h3><div class="kern">“${o.kern}”</div>
      <div class="row"><div class="l">VOOR WIE</div><div class="v">${o.voorwie}</div></div>
      <div class="row"><div class="l">SOORT WERK</div><div class="v">${o.werk}</div></div>
      <div class="row"><div class="l">LEVENSDOMEIN</div><div class="v">${DOMLABEL[o.dom]}</div></div>
      <div class="row"><div class="l">MISVERSTAND</div><div class="v">${o.mis}</div></div>
    </div>`;}).join("");
  const lead=tie
    ? "Twee opleidingen liggen op basis van je antwoorden dicht bij elkaar — het verschil hieronder helpt je verder kiezen."
    : `Op basis van je antwoorden lijkt <b>${OPL[ranked[0]].naam}</b> het dichtst bij je te liggen. Maar lees vooral zelf mee — dit is om mee te denken, niet om voor je te beslissen.`;
  set(`<div class="center"><div class="eyebrow" style="color:var(--salie-d)">✦ het verschil op een rij</div>
      <h1 class="h-m" style="margin-top:10px">Wat deze opleidingen<br>echt onderscheidt</h1></div>
    <div class="card" style="margin-top:20px"><p style="font-size:15.5px;line-height:1.6">${lead}</p></div>
    <div style="margin-top:14px">${cards}</div>
    <div class="card" style="margin-top:14px;background:rgba(193,94,60,.06);border-color:rgba(193,94,60,.2)">
      <div style="font-family:'Cormorant Garamond',serif;font-size:22px">Nog een goede vraag om jezelf te stellen</div>
      <p class="sub" style="text-align:left;margin-top:8px">Stel je een gewone werkdag voor over vijf jaar. Bij welke van deze opleidingen zie je jezelf het liefst bezig — en wat zegt dat?</p>
    </div>
    <div style="margin-top:18px"><button class="btn salie" onclick="go('twIntro')">Opnieuw vergelijken</button>
      <button class="ghost-link" onclick="go('result')">← terug naar mijn route</button></div>`);
}
window.go=(scr)=>{S.screen=scr;render();};

window.addEventListener("beforeprint",()=>syncGespreksPrint());
const hadSavedSession=loadState(); // herstelt een onderbroken sessie (zelfde tabblad/apparaat) automatisch
if(!hadSavedSession) S.screen="cover";
render();
</script>
</body>
</html>
